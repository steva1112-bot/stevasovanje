<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puls — Raspored treninga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,600;0,900;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Puls — design tokens ===== */
:root{
  --bg:#07090a;
  --bg-soft:#0c0f0d;
  --panel:#10130f;
  --panel-2:#151a14;
  --border:#242b22;
  --border-soft:#1a1f18;
  --accent:#79b869;
  --accent-strong:#9bd987;
  --accent-dim:#2f4128;
  --accent-ink:#0a1207;
  --text:#f2f4ee;
  --text-muted:#a7b3a3;
  --text-faint:#647062;
  --danger:#e0796b;
  --danger-dim:#3a231e;
  --warn:#dcb767;
  --warn-dim:#3a3120;
  --rodja:#e07a68;
  --rodja-strong:#f0a294;
  --rodja-dim:#3d211c;
  --boki:#6fa3e0;
  --boki-strong:#9cc4f0;
  --boki-dim:#1d2b3d;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.65);
  --shadow-sm:0 6px 18px -8px rgba(0,0,0,.5);
  --radius:16px;
  --radius-sm:10px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  background:
    radial-gradient(1100px 560px at 14% -8%, rgba(121,184,105,.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(121,184,105,.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
a{color:inherit}
::selection{background:var(--accent-dim);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Login ===== */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
}
.login-card{
  width:100%;
  max-width:400px;
  background:linear-gradient(180deg, var(--panel), var(--bg-soft));
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px 32px 32px;
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute;inset:-40% -10% auto -10%;height:260px;
  background:radial-gradient(closest-side, rgba(121,184,105,.16), transparent);
  pointer-events:none;
}
.login-logo{display:block;width:100%;max-width:260px;margin:0 auto 22px;filter:drop-shadow(0 8px 24px rgba(121,184,105,.18))}
.login-kicker{
  text-align:center;color:var(--text-muted);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:4px;font-weight:600;
}
.login-title{text-align:center;font-size:23px;margin-bottom:26px;color:var(--text)}
.trainer-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.trainer-btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  border-radius:var(--radius-sm);padding:18px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:border-color .15s, transform .15s, background .15s;
  font-family:var(--font-body);
}
.trainer-btn:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
.trainer-btn.active{border-color:var(--accent);background:linear-gradient(180deg, rgba(121,184,105,.14), rgba(121,184,105,.04))}
.trainer-btn[data-trainer="rodja"].active{border-color:var(--rodja);background:linear-gradient(180deg, var(--rodja-dim), rgba(224,122,104,.04))}
.trainer-btn[data-trainer="boki"].active{border-color:var(--boki);background:linear-gradient(180deg, var(--boki-dim), rgba(111,163,224,.04))}
.trainer-avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(155deg, var(--accent-dim), var(--panel-2));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:20px;color:var(--accent-strong);
  flex:0 0 auto;
}
.trainer-avatar.avatar-rodja{background:linear-gradient(155deg, var(--rodja-dim), var(--panel-2));color:var(--rodja-strong);border-color:rgba(224,122,104,.35)}
.trainer-avatar.avatar-boki{background:linear-gradient(155deg, var(--boki-dim), var(--panel-2));color:var(--boki-strong);border-color:rgba(111,163,224,.35)}
.trainer-name{font-weight:600;font-size:14.5px}
.login-form{margin-top:18px;display:none;flex-direction:column;gap:10px}
.login-form.show{display:flex}
.login-error{
  color:var(--danger);font-size:13px;text-align:center;min-height:16px;margin-top:8px;
}
.login-error.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.login-hint{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:18px;line-height:1.6}

/* ===== Form elements ===== */
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:.01em}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:var(--font-body);
}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.field{margin-bottom:14px}
.field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px}
.time-inputs{display:flex;align-items:center;gap:6px}
.time-inputs input{width:100%;text-align:center;-moz-appearance:textfield}
.time-inputs input::-webkit-outer-spin-button,.time-inputs input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.time-colon{font-family:var(--font-display);font-size:16px;color:var(--text-muted);flex:0 0 auto}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-muted)}

.btn{
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:border-color .15s, transform .1s, background .15s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--accent-dim)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg, var(--accent), #5f9c50);border-color:transparent;color:var(--accent-ink)}
.btn-primary:hover{background:linear-gradient(180deg, var(--accent-strong), var(--accent))}
.btn-danger{color:var(--danger);border-color:var(--danger-dim)}
.btn-danger:hover{background:var(--danger-dim)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--panel-2)}
.btn-block{width:100%;justify-content:center}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}

/* ===== App shell ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;background:linear-gradient(180deg, var(--panel), var(--bg-soft));
  border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:22px 16px;
  position:sticky;top:0;height:100vh;
}
.sidebar-logo{display:block;width:100%;margin-bottom:26px;padding:0 4px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:600;border:1px solid transparent;
  transition:background .15s,color .15s;
}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:linear-gradient(180deg, rgba(121,184,105,.16), rgba(121,184,105,.05));color:var(--accent-strong);border-color:var(--border)}
.sidebar-foot{border-top:1px solid var(--border-soft);padding-top:14px;margin-top:10px}
.sidebar-foot #logout-btn{margin-top:8px}
.session-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.session-chip .trainer-avatar{width:34px;height:34px;font-size:14px}
.session-meta{flex:1;min-width:0}
.session-name{font-size:13.5px;font-weight:700;color:var(--text)}
.session-role{font-size:11px;color:var(--text-faint)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.off{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.main{flex:1;min-width:0;padding:30px 36px 60px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.topbar h1{font-size:26px}
.topbar .sub{color:var(--text-muted);font-size:13.5px;margin-top:4px}
.topbar-actions{display:flex;align-items:center;gap:10px}

/* ===== Toast ===== */
#toast-root{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:400}
.toast{
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:12px 16px;
  border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-sm);min-width:220px;
  animation:toast-in .18s ease-out;
}
.toast.error{border-color:var(--danger-dim);color:#f3b3aa}
.toast.success{border-color:var(--accent-dim)}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ===== Calendar ===== */
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-month-label{font-family:var(--font-display);font-size:16px;min-width:190px;text-align:center;text-transform:capitalize}
.cal-mode-toggle{flex:0 0 auto}
.legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted)}
.legend-swatch{width:10px;height:10px;border-radius:3px}
.legend-swatch.swatch-rodja{background:var(--rodja)}
.legend-swatch.swatch-boki{background:var(--boki)}

/* -- month grid -- */
.cal-grid{border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-soft);border-bottom:1px solid var(--border-soft)}
.cal-weekdays div{padding:10px 0;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.cal-weeks{display:grid;grid-auto-rows:minmax(112px,auto)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{
  border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);
  padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;
  transition:background .12s;
}
.cal-day:hover{background:var(--panel-2)}
.cal-day:nth-child(7n){border-right:none}
.cal-day.outside{opacity:.32}
.cal-day.today{background:linear-gradient(180deg, rgba(121,184,105,.08), transparent)}
.cal-daynum{font-size:12.5px;font-weight:700;color:var(--text-muted);display:flex;justify-content:space-between}
.cal-day.today .cal-daynum{color:var(--accent-strong)}
.cal-add{opacity:0;width:18px;height:18px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);transition:opacity .12s}
.cal-day:hover .cal-add{opacity:1}
.cal-sessions{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-more{font-size:10.5px;color:var(--text-faint);padding-left:2px}

/* -- week grid -- */
.cal-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.cal-daycol{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:12px;display:flex;flex-direction:column;gap:10px;min-height:340px;
}
.cal-daycol.today{border-color:var(--accent-dim);background:linear-gradient(180deg, rgba(121,184,105,.07), var(--panel))}
.cal-daycol-head{display:flex;align-items:flex-start;justify-content:space-between}
.cal-daycol-weekday{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.cal-daycol-num{font-family:var(--font-display);font-size:16px;color:var(--text);margin-top:2px}
.cal-daycol.today .cal-daycol-num{color:var(--accent-strong)}
.cal-add-week{
  width:22px;height:22px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted);
  cursor:pointer;flex:0 0 auto;transition:border-color .12s,color .12s;
}
.cal-daycol-head:hover .cal-add-week{border-color:var(--accent-dim);color:var(--accent-strong)}
.cal-daycol-sessions{display:flex;flex-direction:column;gap:6px}
.cal-empty-day{font-size:11.5px;color:var(--text-faint);padding:6px 2px}

/* -- session pill (shared, colored by trainer) -- */
.session-pill{
  font-size:11px;padding:5px 7px;border-radius:7px;display:flex;gap:5px;align-items:center;cursor:pointer;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;
}
.session-pill .t{font-weight:500;flex:0 0 auto;opacity:.85}
.session-pill .nm{overflow:hidden;text-overflow:ellipsis}
.session-pill.trainer-rodja{border-color:rgba(224,122,104,.4);background:rgba(224,122,104,.15);color:var(--rodja-strong)}
.session-pill.trainer-boki{border-color:rgba(111,163,224,.4);background:rgba(111,163,224,.15);color:var(--boki-strong)}
.session-pill.theirs{border-style:dashed;opacity:.82}
.cal-week-grid .session-pill{white-space:normal;flex-wrap:wrap;line-height:1.4}

/* ===== Clients ===== */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.segmented{display:flex;background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:3px}
.segmented button{
  border:none;background:transparent;color:var(--text-muted);padding:7px 14px;border-radius:8px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);
}
.segmented button.active{background:var(--panel-2);color:var(--accent-strong)}
.search-input{max-width:230px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.client-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);
}
.client-card.readonly{opacity:.72}
.client-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.client-name{font-family:var(--font-display);font-size:18px}
.client-phone{font-size:12px;color:var(--text-faint);margin-top:2px}
.trainer-tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:var(--panel-2);color:var(--text-muted);border:1px solid var(--border-soft);flex:0 0 auto;display:inline-block}
.trainer-tag.tag-rodja{background:var(--rodja-dim);color:var(--rodja-strong);border-color:rgba(224,122,104,.35)}
.trainer-tag.tag-boki{background:var(--boki-dim);color:var(--boki-strong);border-color:rgba(111,163,224,.35)}
.status-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;width:fit-content}
.status-pill.ok{background:var(--accent-dim);color:var(--accent-strong)}
.status-pill.warn{background:var(--warn-dim);color:var(--warn)}
.status-pill.bad{background:var(--danger-dim);color:var(--danger)}
.status-pill .dotm{width:6px;height:6px;border-radius:50%;background:currentColor}
.sessions-row{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);flex:0 0 auto}
.dot.filled{background:var(--accent)}
.sessions-count{font-size:12.5px;color:var(--text-muted);font-weight:700;flex:0 0 auto}
.cycle-dates{font-size:11.5px;color:var(--text-faint)}
.client-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.empty-state{
  border:1px dashed var(--border);border-radius:var(--radius);padding:48px 20px;text-align:center;
  color:var(--text-muted);grid-column:1/-1;
}
.empty-state h3{color:var(--text);margin-bottom:6px;font-size:17px}

/* ===== Modal ===== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(2,4,2,.6);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:300;
}
.modal{
  background:linear-gradient(180deg, var(--panel), var(--bg-soft));border:1px solid var(--border);
  border-radius:20px;padding:26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal.wide{max-width:600px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:10px}
.modal-head h2{font-size:19px}
.modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.banner{
  border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;border:1px solid transparent;
}
.banner.warn{background:var(--warn-dim);color:var(--warn);border-color:rgba(220,183,103,.25)}
.banner.bad{background:var(--danger-dim);color:var(--danger);border-color:rgba(224,121,107,.25)}
.history-table{width:100%;border-collapse:collapse;font-size:13px}
.history-table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border-soft)}
.history-table td{padding:8px;border-bottom:1px solid var(--border-soft);color:var(--text-muted)}
.history-table tr:last-child td{border-bottom:none}

/* ===== Settings ===== */
.settings-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px;max-width:420px}

@media (max-width: 860px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%;flex:none;position:relative;height:auto;display:flex;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:10px 14px}
  .sidebar-logo{width:120px;margin:0;order:1;flex:0 0 auto}
  .sidebar-foot{border:none;padding:0;margin:0 0 0 auto;order:2;flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .sidebar-foot .session-chip{padding:0}
  .sidebar-foot #logout-btn{margin-top:0;width:auto;padding:8px 12px}
  .nav{order:3;flex:1 1 100%;flex-direction:row;overflow-x:auto;gap:6px}
  .nav-item{flex:0 0 auto;white-space:nowrap}
  .main{padding:18px 14px 50px}
  .field-row{grid-template-columns:1fr}

  /* touch devices have no hover — keep the add-affordances visible */
  .cal-add{opacity:1}

  /* week view: stack the seven days full-width instead of cramming columns */
  .cal-week-grid{grid-template-columns:1fr}
  .cal-daycol{min-height:0}

  /* month view stays a real grid but scrolls horizontally rather than becoming illegible */
  .cal-grid{overflow-x:auto}
  .cal-weekdays,.cal-week{min-width:560px}

  .topbar{align-items:flex-start}
  .topbar-actions{width:100%}
  .cal-nav{flex:1;justify-content:center}

/* ---------------------------- Utilities ---------------------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const pad2 = n => String(n).padStart(2, '0');
function clampInt(raw, min, max, fallback){
  const n = parseInt(raw, 10);
  if(Number.isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function uid(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function parseYMD(s){
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d, 12, 0, 0);
}
function ymd(dateObj){
  return dateObj.getFullYear() + '-' + pad2(dateObj.getMonth() + 1) + '-' + pad2(dateObj.getDate());
}
function todayISO(){ return ymd(new Date()); }
function addMonthsISO(iso, n){
  const d = parseYMD(iso);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const daysInTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, daysInTarget));
  return ymd(d);
}
function compareISO(a, b){ return a < b ? -1 : (a > b ? 1 : 0); }

const MONTHS_SR = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
const WEEKDAYS_SR = ['Pon','Uto','Sre','Čet','Pet','Sub','Ned'];

function formatDateSr(iso){
  if(!iso) return '—';
  const d = parseYMD(iso);
  return d.getDate() + '. ' + MONTHS_SR[d.getMonth()] + ' ' + d.getFullYear() + '.';
}
function formatDateShortSr(iso){
  if(!iso) return '—';
  const d = parseYMD(iso);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(2);
}
function formatRSD(amount){
  const n = Math.round(Number(amount) || 0);
  // manual thousands separator (avoids relying on locale data support)
  const s = String(Math.abs(n)).split('').reverse().join('').match(/.{1,3}/g).join('.').split('').reverse().join('');
  return (n < 0 ? '-' : '') + s + ' RSD';
}
function monthKey(iso){ return iso.slice(0, 7); }
function monthKeyLabel(key){
  const [y, m] = key.split('-').map(Number);
  return MONTHS_SR[m - 1] + ' ' + y + '.';
}

const TRAINING_DURATION_MIN = 60;
function addMinutesToTime(time, minutes){
  if(!time) return '';
  const [h, m] = time.split(':').map(Number);
  const total = (h * 60 + m + minutes + 1440) % 1440;
  return pad2(Math.floor(total / 60)) + ':' + pad2(total % 60);
}
function timeRangeLabel(time){
  if(!time) return '';
  return time + '–' + addMinutesToTime(time, TRAINING_DURATION_MIN);
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* --------------------------- Business logic -------------------------- */
function trainersList(){ return [STATE.auth.rodja, STATE.auth.boki]; }
function trainerName(id){ return (STATE.auth[id] && STATE.auth[id].name) || id; }
function trainerInitial(id){ return trainerName(id).charAt(0).toUpperCase(); }

function clientById(id){ return STATE.clients.find(c => c.id === id); }

function sessionsUsedFor(client){
  return STATE.trainings.filter(t =>
    t.clientId === client.id &&
    t.date >= client.cycleStart &&
    t.date <= client.cycleEnd
  ).length;
}

function membershipStatus(client){
  const used = sessionsUsedFor(client);
  const today = todayISO();
  const expiredByDate = compareISO(today, client.cycleEnd) > 0;
  const exhausted = used >= client.sessionsTotal;
  if(!client.active) return { label: 'Neaktivan', tone: 'bad', used, expiredByDate, exhausted };
  if(expiredByDate) return { label: 'Isteklo', tone: 'bad', used, expiredByDate, exhausted };
  if(exhausted) return { label: 'Iskorišćeno 10/10', tone: 'warn', used, expiredByDate, exhausted };
  const daysLeft = Math.round((parseYMD(client.cycleEnd) - parseYMD(today)) / 86400000);
  if(daysLeft <= 5) return { label: 'Ističe uskoro', tone: 'warn', used, expiredByDate, exhausted };
  return { label: 'Aktivno', tone: 'ok', used, expiredByDate, exhausted };
}

function clientTrainings(clientId){
  return STATE.trainings.filter(t => t.clientId === clientId).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

/** All payments belonging to one trainer's own clients, newest first, each
 * annotated with the client's name. Earnings are private per trainer — this
 * never mixes in the other trainer's clients. */
function earningsPaymentsFor(trainerId){
  const rows = [];
  STATE.clients.filter(c => c.trainer === trainerId).forEach(c => {
    (c.payments || []).forEach(p => rows.push({ date: p.date, amount: Number(p.amount) || 0, clientName: c.name, clientId: c.id }));
  });
  rows.sort((a, b) => b.date.localeCompare(a.date));
  return rows;
}

function earningsByMonthFor(trainerId){
  const map = {};
  earningsPaymentsFor(trainerId).forEach(p => {
    const key = monthKey(p.date);
    map[key] = (map[key] || 0) + p.amount;
  });
  return map; // { 'YYYY-MM': totalRSD }
}

/* ------------------------------ Toasts ------------------------------ */
function toast(msg, type){
  const root = document.getElementById('toast-root');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 3200);
}

/* --------------------------- Storage + GitHub sync wiring -------------------------- */
const LOCAL_STORAGE_KEY = 'puls_state_v1';
const GITHUB_CONFIG_KEY = 'puls_github_config_v1';
let lastSaveOk = true;
let ghSyncState = 'idle'; // 'idle' | 'syncing' | 'error' | 'unconfigured'

function saveToLocalStorage(state){
  try{ localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state)); lastSaveOk = true; }
  catch(e){ lastSaveOk = false; }
  return lastSaveOk;
}

function getGithubConfig(){
  try{
    const raw = localStorage.getItem(GITHUB_CONFIG_KEY);
    if(!raw) return null;
    const cfg = JSON.parse(raw);
    if(cfg && cfg.owner && cfg.repo && cfg.branch && cfg.path && cfg.token) return cfg;
  }catch(e){ /* ignore */ }
  return null;
}
function saveGithubConfig(cfg){
  try{ localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ return false; }
}
function clearGithubConfig(){
  try{ localStorage.removeItem(GITHUB_CONFIG_KEY); }catch(e){ /* ignore */ }
}

/* UTF-8 safe base64 helpers (Github's Contents API base64-encodes file bytes;
   plain btoa() chokes on non-ASCII chars like c, c, s, dj, z). */
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(b64){ return decodeURIComponent(escape(atob(b64))); }

function githubHeaders(cfg){
  return {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

async function githubGetFileSha(cfg){
  const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path + '?ref=' + encodeURIComponent(cfg.branch);
  const res = await fetch(url, { headers: githubHeaders(cfg) });
  if(res.status === 404) return null;
  if(!res.ok){
    const body = await res.text().catch(() => '');
    throw new Error('GitHub GET ' + res.status + ': ' + body.slice(0, 200));
  }
  const data = await res.json();
  return data.sha;
}

async function githubPutFile(cfg, state, attempt){
  attempt = attempt || 0;
  const sha = await githubGetFileSha(cfg);
  const body = {
    message: 'Puls: azuriranje podataka (' + new Date().toISOString() + ')',
    content: utf8ToBase64(JSON.stringify(state, null, 2)),
    branch: cfg.branch
  };
  if(sha) body.sha = sha;
  const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path;
  const res = await fetch(url, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, githubHeaders(cfg)),
    body: JSON.stringify(body)
  });
  if(res.status === 409 && attempt < 2){
    return githubPutFile(cfg, state, attempt + 1);
  }
  if(!res.ok){
    const errBody = await res.text().catch(() => '');
    throw new Error('GitHub PUT ' + res.status + ': ' + errBody.slice(0, 200));
  }
  return true;
}

async function githubFetchState(cfg){
  const url = 'https://raw.githubusercontent.com/' + cfg.owner + '/' + cfg.repo + '/' + cfg.branch + '/' + cfg.path + '?t=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) return null;
  try{
    const parsed = await res.json();
    if(parsed && parsed.auth && parsed.clients && parsed.trainings) return parsed;
  }catch(e){ /* ignore */ }
  return null;
}

async function publishState(newState, successMsg){
  STATE = newState;
  render();
  saveToLocalStorage(newState);
  const cfg = getGithubConfig();
  if(!cfg){
    ghSyncState = 'unconfigured';
    renderSyncDot();
    if(successMsg) toast(successMsg + ' (samo lokalno — poveži GitHub sinhronizaciju u Podešavanjima)', 'warn');
    return true;
  }
  ghSyncState = 'syncing'; renderSyncDot();
  try{
    await githubPutFile(cfg, newState);
    ghSyncState = 'idle'; renderSyncDot();
    if(successMsg) toast(successMsg, 'success');
  }catch(err){
    ghSyncState = 'error'; renderSyncDot();
    toast('Sačuvano lokalno, ali slanje na GitHub nije uspelo (' + (err && err.message ? err.message : 'greška') + ').', 'error');
  }
  return true;
}

async function initGithubSync(){
  const cfg = getGithubConfig();
  if(!cfg){ ghSyncState = 'unconfigured'; renderSyncDot(); return; }
  ghSyncState = 'syncing'; renderSyncDot();
  try{
    const remote = await githubFetchState(cfg);
    if(remote){ STATE = remote; saveToLocalStorage(STATE); render(); }
    ghSyncState = 'idle';
  }catch(e){
    ghSyncState = 'error';
  }
  renderSyncDot();
}

function renderSyncDot(){
  const dot = document.getElementById('sync-dot');
  if(!dot) return;
  dot.classList.remove('busy', 'off');
  if(ghSyncState === 'syncing') dot.classList.add('busy');
  else if(ghSyncState === 'error' || !lastSaveOk) dot.classList.add('off');
}

function exportStateText(){
  return JSON.stringify(STATE, null, 2);
}

function importStateText(text){
  try{
    const parsed = JSON.parse(text);
    if(!(parsed && parsed.auth && parsed.clients && parsed.trainings)) throw new Error('bad shape');
    STATE = parsed;
    saveToLocalStorage(STATE);
    render();
    toast('Podaci su uvezeni.', 'success');
    return true;
  }catch(e){
    toast('Nevažeći podaci — uvoz nije uspeo.', 'error');
    return false;
  }
}

/* ------------------------------ Mutations ---------------------------- */
function cloneState(){ return JSON.parse(JSON.stringify(STATE)); }

async function addClient({ name, phone, notes, startDate, amount, trainerId }){
  const s = cloneState();
  const client = {
    id: uid('cl'),
    name: name.trim(),
    phone: (phone || '').trim(),
    notes: (notes || '').trim(),
    trainer: trainerId,
    active: true,
    sessionsTotal: 10,
    cycleStart: startDate,
    cycleEnd: addMonthsISO(startDate, 1),
    payments: [{ date: startDate, amount: Math.max(0, Math.round(Number(amount) || 0)) }],
    createdAt: new Date().toISOString()
  };
  s.clients.push(client);
  return publishState(s, 'Klijent je dodat.');
}

async function updateClient(clientId, patch){
  const s = cloneState();
  const c = s.clients.find(x => x.id === clientId);
  if(!c) return false;
  Object.assign(c, patch);
  return publishState(s, 'Podaci klijenta su ažurirani.');
}

async function recordPayment(clientId, paymentDate, amount){
  const s = cloneState();
  const c = s.clients.find(x => x.id === clientId);
  if(!c) return false;
  c.cycleStart = paymentDate;
  c.cycleEnd = addMonthsISO(paymentDate, 1);
  c.payments = c.payments || [];
  c.payments.push({ date: paymentDate, amount: Math.max(0, Math.round(Number(amount) || 0)) });
  c.active = true;
  return publishState(s, 'Uplata je evidentirana — nov ciklus od 10 treninga.');
}

async function addTraining({ clientId, date, time, notes }){
  const s = cloneState();
  const c = s.clients.find(x => x.id === clientId);
  if(!c) return false;
  const used = s.trainings.filter(t => t.clientId === c.id && t.date >= c.cycleStart && t.date <= c.cycleEnd).length;
  const training = {
    id: uid('tr'),
    clientId: c.id,
    clientName: c.name,
    trainer: c.trainer,
    date, time: time || '',
    sessionNumber: used + 1,
    notes: (notes || '').trim(),
    createdAt: new Date().toISOString()
  };
  s.trainings.push(training);
  return publishState(s, 'Termin je zakazan.');
}

async function updateTraining(trainingId, patch){
  const s = cloneState();
  const t = s.trainings.find(x => x.id === trainingId);
  if(!t) return false;
  Object.assign(t, patch);
  return publishState(s, 'Termin je izmenjen.');
}

async function deleteTraining(trainingId){
  const s = cloneState();
  s.trainings = s.trainings.filter(x => x.id !== trainingId);
  return publishState(s, 'Termin je obrisan.');
}

async function changePassword(trainerId, newHash){
  const s = cloneState();
  s.auth[trainerId].passwordHash = newHash;
  return publishState(s, 'Lozinka je promenjena.');
}

/* ------------------------------ Calendar view ------------------------------ */
function monthLabel(iso){
  const d = parseYMD(iso);
  return MONTHS_SR[d.getMonth()] + ' ' + d.getFullYear() + '.';
}
function startOfWeekISO(iso){
  const d = parseYMD(iso);
  const offset = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - offset);
  return ymd(d);
}
function weekRangeLabel(mondayIso){
  const start = parseYMD(mondayIso);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  if(sameMonth){
    return start.getDate() + '–' + end.getDate() + '. ' + MONTHS_SR[start.getMonth()] + ' ' + start.getFullYear() + '.';
  }
  const sameYear = start.getFullYear() === end.getFullYear();
  const startStr = start.getDate() + '. ' + MONTHS_SR[start.getMonth()] + (sameYear ? '' : ' ' + start.getFullYear() + '.');
  const endStr = end.getDate() + '. ' + MONTHS_SR[end.getMonth()] + ' ' + end.getFullYear() + '.';
  return startStr + ' – ' + endStr;
}
function shiftCalAnchor(delta){
  const d = parseYMD(ui.calAnchor);
  if(ui.calMode === 'week') d.setDate(d.getDate() + delta * 7);
  else d.setMonth(d.getMonth() + delta);
  ui.calAnchor = ymd(d);
}

function trainingsByDate(){
  const map = {};
  STATE.trainings.forEach(t => {
    (map[t.date] = map[t.date] || []).push(t);
  });
  Object.values(map).forEach(arr => arr.sort((a, b) => (a.time || '').localeCompare(b.time || '')));
  return map;
}

function sessionPillHtml(t, session){
  const mineClass = t.trainer === session ? 'mine' : 'theirs';
  return `
    <div class="session-pill trainer-${t.trainer} ${mineClass}" data-training="${t.id}" title="${escapeHtml(t.clientName)}${t.time ? ' · ' + timeRangeLabel(t.time) : ''}">
      ${t.time ? `<span class="t">${timeRangeLabel(t.time)}</span>` : ''}<span class="nm">${escapeHtml(t.clientName)}</span>

}

    <div class="legend-item"><span class="legend-swatch swatch-boki"></span> ${escapeHtml(trainerName('boki'))}</div>
  </div>`;
}

function renderWeekGrid(session){
  const byDate = trainingsByDate();
  const today = todayISO();
  const monday = startOfWeekISO(ui.calAnchor);
  const start = parseYMD(monday);
  let cols = [];
  for(let i = 0; i < 7; i++){
    const cursor = new Date(start); cursor.setDate(cursor.getDate() + i);
    const iso = ymd(cursor);
    const list = byDate[iso] || [];
    cols.push(`
      <div class="cal-daycol ${iso === today ? 'today' : ''}" data-date="${iso}">
        <div class="cal-daycol-head">
          <div>
            <div class="cal-daycol-weekday">${WEEKDAYS_SR[i]}</div>
            <div class="cal-daycol-num">${cursor.getDate()}.${pad2(cursor.getMonth() + 1)}.</div>
          </div>
          <button type="button" class="cal-add-week" data-add-date="${iso}" title="Novi termin">+</button>
        </div>
        <div class="cal-daycol-sessions">
          ${list.length ? list.map(t => sessionPillHtml(t, session)).join('') : `<div class="cal-empty-day">Nema termina</div>`}
        </div>
      </div>`);
  }
  return `<div class="cal-week-grid">${cols.join('')}</div>`;
}

function renderMonthGrid(session){
  const d = parseYMD(ui.calAnchor);
  const y = d.getFullYear(), m = d.getMonth() + 1;
  const first = new Date(y, m - 1, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const gridStart = new Date(y, m - 1, 1 - startOffset);
  const byDate = trainingsByDate();
  const today = todayISO();

  let weeks = [];
  let cursor = new Date(gridStart);
  for(let w = 0; w < 6; w++){
    let days = [];
    for(let dd = 0; dd < 7; dd++){
      const iso = ymd(cursor);
      const inMonth = cursor.getMonth() === m - 1;
      const list = byDate[iso] || [];
      const visible = list.slice(0, 3);
      const overflow = list.length - visible.length;
      days.push(`
        <div class="cal-day ${inMonth ? '' : 'outside'} ${iso === today ? 'today' : ''}" data-date="${iso}">
          <div class="cal-daynum"><span>${cursor.getDate()}</span><span class="cal-add" data-add-date="${iso}">+</span></div>
          <div class="cal-sessions">
            ${visible.map(t => sessionPillHtml(t, session)).join('')}
            ${overflow > 0 ? `<div class="cal-more">+${overflow} još</div>` : ''}
          </div>
        </div>`);
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(`<div class="cal-week">${days.join('')}</div>`);
    if(cursor.getMonth() !== m - 1 && w >= 3) break;
  }
  return `
  <div class="cal-grid">
    <div class="cal-weekdays">${WEEKDAYS_SR.map(dn => `<div>${dn}</div>`).join('')}</div>
    <div class="cal-weeks">${weeks.join('')}</div>
  </div>`;
}

function renderCalendarView(session){

  const body = isWeek ? renderWeekGrid(session) : renderMonthGrid(session);

/* ------------------------------ Event wiring ------------------------------ */
function wireGlobalEvents(session){
  if(!session){ wireLogin(); return; }

  $$('.nav-item[data-tab]').forEach(el => el.addEventListener('click', () => { ui.tab = el.dataset.tab; render(); }));
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', () => { setSession(null); render(); });

  if(ui.tab === 'calendar') wireCalendar(session);
  if(ui.tab === 'clients') wireClients(session);
  if(ui.tab === 'settings') wireSettings(session);

  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop){
    backdrop.addEventListener('mousedown', e => { if(e.target === backdrop) closeModal(); });
    $$('[data-close]', backdrop).forEach(el => el.addEventListener('click', closeModal));
    if(ui.modal.onMount) ui.modal.onMount(backdrop, session);
  }
}

function wireLogin(){
  let selected = null;
  const picker = document.getElementById('trainer-picker');
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  $$('.trainer-btn', picker).forEach(btn => {
    btn.addEventListener('click', () => {
      selected = btn.dataset.trainer;
      $$('.trainer-btn', picker).forEach(b => b.classList.toggle('active', b === btn));
      form.classList.add('show');
      errorEl.textContent = '';
      const pwInput = document.getElementById('login-password');
      pwInput.value = '';
      pwInput.focus();
    });
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if(!selected) return;
    const pw = document.getElementById('login-password').value;
    const hash = await sha256Hex(pw);
    const account = STATE.auth[selected];
    if(account && hash === account.passwordHash){
      setSession(selected);
      render();
    }else{
      errorEl.textContent = 'Pogrešna lozinka. Pokušajte ponovo.';
      errorEl.classList.remove('shake'); void errorEl.offsetWidth; errorEl.classList.add('shake');
    }
  });
}

function wireCalendar(session){
  document.getElementById('cal-prev').addEventListener('click', () => { shiftCalAnchor(-1); render(); });
  document.getElementById('cal-next').addEventListener('click', () => { shiftCalAnchor(1); render(); });
  document.getElementById('cal-today').addEventListener('click', () => { ui.calAnchor = todayISO(); render(); });
  document.getElementById('cal-new').addEventListener('click', () => openTrainingModal(session, {}));
  $$('.cal-mode-toggle button').forEach(b => b.addEventListener('click', () => { ui.calMode = b.dataset.calmode; render(); }));

  $$('.cal-add, .cal-add-week').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    openTrainingModal(session, { date: el.dataset.addDate });
  }));
  $$('.session-pill').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();
    const t = STATE.trainings.find(x => x.id === el.dataset.training);
    if(!t) return;
    if(t.trainer === session) openTrainingModal(session, { existing: t });
    else openModal(modalTrainingReadonly(t));
  }));
}

function wireClients(session){
  document.getElementById('client-new').addEventListener('click', () => openModal(modalClientForm(session, null), (backdrop) => wireClientForm(session, backdrop, null)));
  document.getElementById('client-search').addEventListener('input', e => { ui.clientSearch = e.target.value; render(); });
  $$('.segmented button').forEach(b => b.addEventListener('click', () => { ui.clientFilter = b.dataset.filter; render(); }));

  $$('[data-schedule-for]').forEach(b => b.addEventListener('click', () => openTrainingModal(session, { presetClient: b.dataset.scheduleFor })));
  $$('[data-pay-for]').forEach(b => b.addEventListener('click', () => {
    const c = clientById(b.dataset.payFor);
    openModal(modalPaymentForm(c), backdrop => wirePaymentForm(c, backdrop));
  }));
  $$('[data-history-for]').forEach(b => b.addEventListener('click', () => {
    const c = clientById(b.dataset.historyFor);
    openModal(modalHistory(c));
  }));
  $$('[data-edit-client]').forEach(b => b.addEventListener('click', () => {
    const c = clientById(b.dataset.editClient);
    openModal(modalClientForm(session, c), backdrop => wireClientForm(session, backdrop, c));
  }));
}

function wireSettings(session){
  document.getElementById('password-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errorEl = document.getElementById('pw-error');
    errorEl.textContent = '';
    const cur = document.getElementById('pw-current').value;
    const next = document.getElementById('pw-new').value;
    const confirm = document.getElementById('pw-confirm').value;
    const curHash = await sha256Hex(cur);
    if(curHash !== STATE.auth[session].passwordHash){ errorEl.textContent = 'Trenutna lozinka nije tačna.'; return; }
    if(next.length < 4){ errorEl.textContent = 'Nova lozinka mora imati bar 4 karaktera.'; return; }
    if(next !== confirm){ errorEl.textContent = 'Lozinke se ne poklapaju.'; return; }
    const newHash = await sha256Hex(next);
    await changePassword(session, newHash);
    document.getElementById('password-form').reset();
  });

  const ghSaveBtn = document.getElementById('gh-save-btn');
  if(ghSaveBtn) ghSaveBtn.addEventListener('click', async () => {
    const errEl = document.getElementById('gh-error');
    errEl.textContent = '';
    const repoRaw = document.getElementById('gh-repo').value.trim();
    const branch = document.getElementById('gh-branch').value.trim() || 'main';
    const path = document.getElementById('gh-path').value.trim().replace(/^\/+/, '');
    const tokenRaw = document.getElementById('gh-token').value.trim();
    const existing = getGithubConfig();
    const parts = repoRaw.split('/').map(s => s.trim()).filter(Boolean);
    if(parts.length !== 2){ errEl.textContent = 'Unesi u obliku vlasnik/naziv-repozitorijuma.'; return; }
    if(!path){ errEl.textContent = 'Unesi putanju do fajla (npr. puls/data.json).'; return; }
    const token = tokenRaw || (existing ? existing.token : '');
    if(!token){ errEl.textContent = 'Unesi GitHub token.'; return; }
    const cfg = { owner: parts[0], repo: parts[1], branch, path, token };
    ghSaveBtn.disabled = true; ghSaveBtn.textContent = 'Proveravam...';
    try{
      await githubGetFileSha(cfg); // 404 (fajl još ne postoji) je OK — samo potvrđujemo da su repo/grana/token ispravni
      saveGithubConfig(cfg);
      toast('GitHub sinhronizacija je povezana.', 'success');
      render();
    }catch(e){
      errEl.textContent = 'Neuspešno povezivanje: ' + (e && e.message ? e.message : 'proveri podatke i token.');
      ghSaveBtn.disabled = false; ghSaveBtn.textContent = 'Sačuvaj i poveži';
    }
  });
  const ghDisconnectBtn = document.getElementById('gh-disconnect-btn');
  if(ghDisconnectBtn) ghDisconnectBtn.addEventListener('click', () => {
    clearGithubConfig();
    ghSyncState = 'unconfigured';
    render();
    toast('GitHub sinhronizacija je isključena (podaci ostaju sačuvani lokalno).', 'success');
  });

  const exportBox = document.getElementById('export-box');
  if(exportBox) exportBox.value = exportStateText();
  const copyBtn = document.getElementById('export-copy-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(exportBox.value); toast('Kopirano.', 'success'); }
    catch(e){ exportBox.select(); toast('Označeno — kopirajte sa Ctrl+C / Cmd+C.', 'success'); }
  });
  const importBtn = document.getElementById('import-btn');
  if(importBtn) importBtn.addEventListener('click', () => {
    const box = document.getElementById('import-box');
    if(box && box.value.trim()) importStateText(box.value.trim());
  });
}

function openTrainingModal(session, opts){
  opts = opts || {};
  let presetClientId = opts.presetClient || null;
  openModal(modalTrainingForm(session, opts), backdrop => {
    const clientSelect = document.getElementById('tf-client');
    if(clientSelect && presetClientId) clientSelect.value = presetClientId;
    const warnBox = document.getElementById('tf-warning');
    function checkWarning(){
      if(!clientSelect) return;
      const c = clientById(clientSelect.value);
      if(!c){ warnBox.innerHTML = ''; return; }
      const st = membershipStatus(c);
      if(st.exhausted) warnBox.innerHTML = `<div class="banner bad">Klijent je iskoristio svih 10 treninga u ovom ciklusu. Razmislite o evidentiranju nove uplate pre zakazivanja.</div>`;
      else if(st.expiredByDate) warnBox.innerHTML = `<div class="banner bad">Članarina je istekla ${formatDateSr(c.cycleEnd)}. Potrebna je nova uplata.</div>`;
      else warnBox.innerHTML = '';
    }
    if(clientSelect){ clientSelect.addEventListener('change', checkWarning); checkWarning(); }

    const hourInput = document.getElementById('tf-hour');
    const minuteInput = document.getElementById('tf-minute');
    const timeHint = document.getElementById('tf-time-hint');
    function readTimeValue(){
      if(!hourInput || !minuteInput) return '';
      const hRaw = hourInput.value.trim();
      const mRaw = minuteInput.value.trim();
      if(hRaw === '' && mRaw === '') return '';
      let h = clampInt(hRaw, 0, 23, 0);
      let m = clampInt(mRaw, 0, 59, 0);
      return pad2(h) + ':' + pad2(m);
    }
    function updateTimeHint(){
      if(!timeHint) return;
      const val = readTimeValue();
      timeHint.textContent = val
        ? `Trening traje 1 sat — od ${timeRangeLabel(val).replace('–', ' do ')}.`
        : 'Svaki trening traje 1 sat.';
    }
    if(hourInput && minuteInput){
      hourInput.addEventListener('input', updateTimeHint);
      minuteInput.addEventListener('input', updateTimeHint);
      updateTimeHint();
    }

    const form = document.getElementById('training-form');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if(opts.existing){
        await updateTraining(opts.existing.id, {
          date: document.getElementById('tf-date').value,
          time: readTimeValue(),
          notes: document.getElementById('tf-notes').value
        });
      }else{
        const clientId = document.getElementById('tf-client').value;
        if(!clientId) return;
        await addTraining({
          clientId,
          date: document.getElementById('tf-date').value,
          time: readTimeValue(),
          notes: document.getElementById('tf-notes').value
        });
      }
      closeModal();
    });
    const delBtn = $('[data-delete-training]', backdrop);
    if(delBtn) delBtn.addEventListener('click', async () => {
      await deleteTraining(delBtn.dataset.deleteTraining);
      closeModal();
    });
  });
}

function wireClientForm(session, backdrop, existing){
  const form = document.getElementById('client-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('cf-name').value.trim();
    if(!name) return;
    const phone = document.getElementById('cf-phone').value;
    const notes = document.getElementById('cf-notes').value;
    if(existing){
      const active = document.getElementById('cf-active').checked;
      await updateClient(existing.id, { name, phone, notes, active });
    }else{
      const startDate = document.getElementById('cf-start').value || todayISO();
      const amount = document.getElementById('cf-amount').value;
      await addClient({ name, phone, notes, startDate, amount, trainerId: session });
    }
    closeModal();
  });
}

function wirePaymentForm(client, backdrop){
  const form = document.getElementById('payment-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
