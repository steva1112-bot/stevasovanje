<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP 2026 — Prognoza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAEEF3;--surface:#fff;--ink:#0C1B2A;--muted:#64748B;--hair:#E4E9F0;--pitch:#00B26B;--pitch-d:#089b60;--chip:#F1F5F9;--gold:#E3A81B;--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:60px}
.app{max-width:1040px;margin:0 auto;padding:0 16px}

/* hero */
.hero{background:linear-gradient(135deg,#0C1B2A 0%,#0f243a 55%,#0a3a20 100%);color:#fff;border-radius:0 0 26px 26px;padding:30px 22px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,178,107,.30),transparent 70%)}
.hero-row{display:flex;align-items:center;gap:18px;position:relative;z-index:1;flex-wrap:wrap}
.crest{width:78px;height:78px;flex-shrink:0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.5vw,38px);letter-spacing:-.01em;line-height:1.05}
.hero .tag{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#7FE3B5;margin-bottom:4px}
.hero .host{display:flex;gap:6px;margin-top:9px;align-items:center;font-size:12px;color:#C7D2DE}
.hflag{width:22px;height:15px;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.25);display:inline-block}
.hflag svg{display:block;width:100%;height:100%}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:4px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--muted);border:none;background:none}
.tab.active{background:var(--ink);color:#fff}
.spacer{flex:1}
.btn{font-family:var(--display);font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer;border:1px solid var(--hair);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#cbd5e1}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:#063}
.btn.warn{color:#9c1b1b}
.editflag{font-family:var(--display);font-weight:600;font-size:12px;color:var(--pitch-d);background:rgba(0,178,107,.12);padding:7px 12px;border-radius:999px;display:none}
body.edit .editflag{display:inline-flex;align-items:center;gap:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* fixtures */
.sec-label{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 2px 11px}
.fixtures{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.fx{background:#fff;border:1px solid var(--hair);border-radius:15px;padding:14px;position:relative;overflow:hidden}
.fx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#CBD5E1}
.fx.done::before{background:var(--pitch)}
.fx .row{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.fx .row+.row{margin-top:7px}
.fx .nat{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{width:23px;height:15px;border-radius:3px;overflow:hidden;border:1px solid rgba(12,27,42,.12);flex-shrink:0;display:inline-block;background:#fff}
.flag svg{display:block;width:100%;height:100%}
.scorebox{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--hair)}
.fxscore{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:2px}
.cap{position:absolute;top:11px;right:12px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.resin{width:30px;height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;border:1.5px solid var(--hair);border-radius:8px;background:#FAFBFD}
.blank{width:28px;height:32px;border:1.5px solid var(--hair);border-radius:8px;background:#FAFBFD;display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-family:var(--display);font-weight:700}

/* board */
.board{background:#fff;border:1px solid var(--hair);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(12,27,42,.06);margin-top:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
thead th{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 9px 10px;background:#FBFCFE;border-bottom:1px solid var(--hair);white-space:nowrap}
thead th.c{text-align:center}
tbody td{padding:9px;border-bottom:1px solid var(--hair);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.rank{width:44px;text-align:center}.medal{font-size:18px}.rnum{font-family:var(--display);font-weight:600;color:var(--muted)}
tr.r1 td{background:linear-gradient(90deg,rgba(227,168,27,.16),transparent 60%)}
tr.r2 td{background:linear-gradient(90deg,rgba(150,160,170,.16),transparent 60%)}
tr.r3 td{background:linear-gradient(90deg,rgba(200,140,80,.14),transparent 60%)}
.num{font-family:var(--display);font-weight:600;color:var(--muted);width:28px;text-align:center;font-size:12px}
.player{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.av{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.champ{display:flex;align-items:center;gap:8px;color:#334155;white-space:nowrap;font-size:13px}
.strelac{color:var(--muted);white-space:nowrap;font-size:13px}
td.tip{text-align:center}
.chip{font-family:var(--display);font-weight:600;font-size:13px;background:var(--chip);color:var(--ink);padding:5px 9px;border-radius:8px;display:inline-block;min-width:44px}
.chip.empty{background:transparent;color:#CBD5E1}
.tot{font-family:var(--display);font-weight:700;font-size:16px;text-align:center;color:var(--pitch-d)}
.tipin{width:54px;text-align:center;font-family:var(--display);font-weight:600;font-size:13px;border:1px solid var(--hair);border-radius:7px;padding:5px 4px;background:#FAFBFD}
.golin{width:42px;text-align:center;font-family:var(--display);font-weight:600;font-size:13px;border:1px solid var(--hair);border-radius:7px;padding:5px;background:#FAFBFD}
.pts{font-family:var(--display);font-weight:700;font-size:11px;color:var(--pitch-d);margin-left:5px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
.hide{display:none!important}

/* modal */
.modal{position:fixed;inset:0;background:rgba(12,27,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.card{background:#fff;border-radius:18px;padding:26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card h3{font-family:var(--display);font-size:18px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted);margin-bottom:16px}
.card input{width:100%;padding:11px 13px;border:1px solid var(--hair);border-radius:10px;font-size:15px;font-family:var(--body);margin-bottom:14px}
.card .row2{display:flex;gap:9px}
@media(max-width:760px){.fixtures{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-row">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD966"/><stop offset="1" stop-color="#E3A81B"/></linearGradient></defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#7FE3B5" stroke-width="2" opacity=".5"/>
      <circle cx="50" cy="50" r="38" fill="rgba(255,255,255,.04)"/>
      <!-- trophy -->
      <path d="M38 28 h24 v10 a12 12 0 0 1 -24 0 z" fill="url(#g)"/>
      <path d="M38 30 h-7 a8 8 0 0 0 8 9" fill="none" stroke="url(#g)" stroke-width="3"/>
      <path d="M62 30 h7 a8 8 0 0 1 -8 9" fill="none" stroke="url(#g)" stroke-width="3"/>
      <rect x="46" y="50" width="8" height="9" fill="url(#g)"/>
      <rect x="40" y="59" width="20" height="5" rx="1.5" fill="url(#g)"/>
      <text x="50" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="13" fill="#fff">2026</text>
    </svg>
    <div>
      <div class="tag">Prognoza · Kladionica ekipe</div>
      <h1>Svetsko prvenstvo 2026</h1>
      <div class="host">Domaćini:
        <span class="hflag" id="hca"></span><span class="hflag" id="hmx"></span><span class="hflag" id="hus"></span>
        <span style="margin-left:4px">Kanada · Meksiko · SAD</span>
      </div>
    </div>
  </div>
</div>

<div class="app">
  <div class="bar">
    <div class="tabs">
      <button class="tab active" data-tab="rang">Rang-lista</button>
      <button class="tab" data-tab="tipovi">Tipovi</button>
    </div>
    <span class="editflag">✎ Režim izmena</span>
    <div class="spacer"></div>
    <button class="btn" id="adminBtn">🔒 Uredi</button>
    <button class="btn hide" id="exportBtn">⤓ Objavi (data.json)</button>
    <button class="btn hide" id="backupBtn">Rezerva</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="sec-label">Mečevi <span id="editnote" class="hide" style="text-transform:none;letter-spacing:0;color:var(--pitch-d)">· upiši stvaran rezultat</span></div>
  <div class="fixtures" id="fixtures"></div>

  <div class="sec-label" id="tablabel">Rang-lista</div>
  <div class="board"><div class="scroll"><table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table></div></div>

  <div class="foot">🥇 vodi · računa se uživo · Svet je knjiga — a ovo je rang-lista čitalaca.</div>
</div>

<!-- PIN modal -->
<div class="modal" id="pinModal">
  <div class="card">
    <h3>Uređivanje</h3>
    <p>Unesi PIN da otključaš izmene. Ostali vide samo rezultate.</p>
    <input type="password" id="pinInput" placeholder="PIN" autocomplete="off">
    <div class="row2">
      <button class="btn" style="flex:1" onclick="closePin()">Otkaži</button>
      <button class="btn primary" style="flex:1" onclick="tryPin()">Otključaj</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" class="hide">

<script>
// ====== CONFIG ======
const ADMIN_PIN = "steva2026";   // <-- promeni ovo u svoj PIN
const FLAGS = {"fr": "<svg viewBox=\"0 0 3 2\"><rect width=\"3\" height=\"2\" fill=\"#fff\"/><rect width=\"1\" height=\"2\" fill=\"#0055A4\"/><rect x=\"2\" width=\"1\" height=\"2\" fill=\"#EF4135\"/></svg>", "es": "<svg viewBox=\"0 0 12 8\"><rect width=\"12\" height=\"8\" fill=\"#AA151B\"/><rect y=\"2\" width=\"12\" height=\"4\" fill=\"#F1BF00\"/></svg>", "pt": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#FF0000\"/><rect width=\"12\" height=\"20\" fill=\"#006600\"/><circle cx=\"12\" cy=\"10\" r=\"3.4\" fill=\"#FFD700\" stroke=\"#fff\" stroke-width=\".4\"/></svg>", "de": "<svg viewBox=\"0 0 3 3\"><rect width=\"3\" height=\"3\" fill=\"#FFCE00\"/><rect width=\"3\" height=\"2\" fill=\"#D00\"/><rect width=\"3\" height=\"1\" fill=\"#000\"/></svg>", "br": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#009C3B\"/><polygon points=\"15,2.5 27.5,10 15,17.5 2.5,10\" fill=\"#FFDF00\"/><circle cx=\"15\" cy=\"10\" r=\"4.1\" fill=\"#002776\"/></svg>", "eng": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#fff\"/><rect x=\"12.5\" width=\"5\" height=\"20\" fill=\"#CE1124\"/><rect y=\"7.5\" width=\"30\" height=\"5\" fill=\"#CE1124\"/></svg>", "ar": "<svg viewBox=\"0 0 9 6\"><rect width=\"9\" height=\"6\" fill=\"#74ACDF\"/><rect y=\"2\" width=\"9\" height=\"2\" fill=\"#fff\"/><circle cx=\"4.5\" cy=\"3\" r=\".7\" fill=\"#F6B40E\"/></svg>", "nl": "<svg viewBox=\"0 0 3 3\"><rect width=\"3\" height=\"3\" fill=\"#21468B\"/><rect width=\"3\" height=\"2\" fill=\"#fff\"/><rect width=\"3\" height=\"1\" fill=\"#AE1C28\"/></svg>", "mx": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#fff\"/><rect width=\"10\" height=\"20\" fill=\"#006847\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#CE1126\"/><circle cx=\"15\" cy=\"10\" r=\"2\" fill=\"#8a5a2b\"/></svg>", "za": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#007749\"/><path d=\"M11,0 H30 V8 H15 Z\" fill=\"#E03C31\"/><path d=\"M11,20 H30 V12 H15 Z\" fill=\"#001489\"/><path d=\"M0,0 L9,10 L0,20 Z\" fill=\"#000\"/></svg>", "kr": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#fff\"/><path d=\"M15,5 a5,5 0 0,1 0,10 a2.5,2.5 0 0,1 0,-5 a2.5,2.5 0 0,0 0,-5 Z\" fill=\"#CD2E3A\"/><path d=\"M15,5 a5,5 0 0,0 0,10 a2.5,2.5 0 0,0 0,-5 a2.5,2.5 0 0,1 0,-5 Z\" fill=\"#0047A0\"/></svg>", "cz": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"10\" fill=\"#fff\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#D7141A\"/><path d=\"M0,0 L15,10 L0,20 Z\" fill=\"#11457E\"/></svg>", "ca": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#fff\"/><rect width=\"7.5\" height=\"20\" fill=\"#D52B1E\"/><rect x=\"22.5\" width=\"7.5\" height=\"20\" fill=\"#D52B1E\"/><path d=\"M15,4.5 l1,2.6 2.7,-1 -1,2.6 2.6,1 -2.6,1.1 1,2.6 -2.7,-1.1 -1,2.1 -1,-2.1 -2.7,1.1 1,-2.6 -2.6,-1.1 2.6,-1 -1,-2.6 2.7,1 Z\" fill=\"#D52B1E\"/></svg>", "ba": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#002395\"/><path d=\"M8,0 H24 L8,20 Z\" fill=\"#FECB00\"/><circle cx=\"11\" cy=\"4\" r=\"1\" fill=\"#fff\"/><circle cx=\"9\" cy=\"10\" r=\"1\" fill=\"#fff\"/><circle cx=\"11\" cy=\"16\" r=\"1\" fill=\"#fff\"/></svg>", "us": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"20\" fill=\"#fff\"/><g fill=\"#B22234\"><rect width=\"30\" height=\"1.54\"/><rect y=\"3.08\" width=\"30\" height=\"1.54\"/><rect y=\"6.15\" width=\"30\" height=\"1.54\"/><rect y=\"9.23\" width=\"30\" height=\"1.54\"/><rect y=\"12.3\" width=\"30\" height=\"1.54\"/><rect y=\"15.38\" width=\"30\" height=\"1.54\"/><rect y=\"18.46\" width=\"30\" height=\"1.54\"/></g><rect width=\"12\" height=\"10.77\" fill=\"#3C3B6E\"/></svg>", "py": "<svg viewBox=\"0 0 30 20\"><rect width=\"30\" height=\"6.67\" fill=\"#D52B1E\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#fff\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#0038A8\"/><circle cx=\"15\" cy=\"10\" r=\"2\" fill=\"#FEDF00\"/></svg>"};
const TEAM2CODE = {"Meksiko": "mx", "Južna Afrika": "za", "Južna Koreja": "kr", "Češka": "cz", "Kanada": "ca", "Bosna": "ba", "USA": "us", "Paragvaj": "py", "J. Afrika": "za", "J. Koreja": "kr"};
const REP2CODE = {"Francuska": "fr", "Španija": "es", "Portugal": "pt", "Nemačka": "de", "Brazil": "br", "Engleska": "eng", "Argentina": "ar", "Holandija": "nl"};
const SEED = {"players": [{"br": 1, "ime": "Lane", "rep": "Francuska", "strelac": "Mbape", "golovi": 0, "tips": ["2 - 0", "1 - 2", "1 - 1", "0 - 1"], "code": "fr"}, {"br": 2, "ime": "Bugarin", "rep": "Španija", "strelac": "Jamal", "golovi": 0, "tips": ["2 - 0", "0 - 1", "2 - 1", "2 - 0"], "code": "es"}, {"br": 3, "ime": "Bobi", "rep": "Portugal", "strelac": "Kane", "golovi": 0, "tips": ["2 - 0", "1 - 1", "0 - 0", "1 - 0"], "code": "pt"}, {"br": 4, "ime": "Mika", "rep": "Nemačka", "strelac": "Havertz", "golovi": 0, "tips": ["1 - 0", "1 - 3", "2 - 2", "2 - 1"], "code": "de"}, {"br": 5, "ime": "Steva", "rep": "Brazil", "strelac": "Vinicius JR", "golovi": 0, "tips": ["2 - 1", "1 - 1", "2 - 1", "0 - 0"], "code": "br"}, {"br": 6, "ime": "Filip", "rep": "Portugal", "strelac": "Ojarzabal", "golovi": 0, "tips": ["2 - 0", "1 - 1", "0 - 1", "2 - 0"], "code": "pt"}, {"br": 7, "ime": "Šomi", "rep": "Engleska", "strelac": "Kane", "golovi": 0, "tips": ["1 - 0", "0 - 2", "0 - 0", "2 - 0"], "code": "eng"}, {"br": 8, "ime": "Sima", "rep": "Argentina", "strelac": "Mbape", "golovi": 0, "tips": ["3 - 1", "1 - 0", "1 - 1", "2 - 0"], "code": "ar"}, {"br": 9, "ime": "Poša", "rep": "Brazil", "strelac": "Mbape", "golovi": 0, "tips": ["3 - 1", "1 - 2", "1 - 1", "0 - 0"], "code": "br"}, {"br": 10, "ime": "Maja", "rep": "Španija", "strelac": "Mbape", "golovi": 0, "tips": ["2 - 0", "1 - 1", "1 - 0", "2 - 1"], "code": "es"}, {"br": 11, "ime": "Deki stanar", "rep": "Španija", "strelac": "Mbape", "golovi": 0, "tips": ["2 - 0", "1 - 1", "2 - 1", "1 - 0"], "code": "es"}, {"br": 12, "ime": "Boris", "rep": "Nemačka", "strelac": "Kane", "golovi": 0, "tips": ["3 - 1", "1 - 3", "2 - 1", "3 - 1"], "code": "de"}, {"br": 13, "ime": "Džoni ZR", "rep": "Holandija", "strelac": "Haland", "golovi": 0, "tips": ["1 - 0", "0 - 0", "1 - 1", "2 - 1"], "code": "nl"}, {"br": 14, "ime": "Tomaš", "rep": "Španija", "strelac": "Tores F.", "golovi": 0, "tips": ["2 - 1", "1 - 1", "1 - 1", "2 - 2"], "code": "es"}, {"br": 15, "ime": "Ćilim", "rep": "Francuska", "strelac": "Mbape", "golovi": 0, "tips": ["1 - 0", "1 - 0", "1 - 0", "1 - 0"], "code": "fr"}, {"br": 16, "ime": "Deki šurak", "rep": "Brazil", "strelac": "Havertz", "golovi": 0, "tips": ["1 - 0", "0 - 0", "2 - 0", "2 - 1"], "code": "br"}, {"br": 17, "ime": "Ćino", "rep": "Argentina", "strelac": "Alvarez J.", "golovi": 0, "tips": ["3 - 0", "0 - 0", "1 - 0", "3 - 0"], "code": "ar"}, {"br": 18, "ime": "Smudja", "rep": "Francuska", "strelac": "Mbape", "golovi": 0, "tips": ["2 - 0", "1 - 1", "1 - 1", "1 - 0"], "code": "fr"}, {"br": 19, "ime": "Bondža", "rep": "Španija", "strelac": "Jekeres V.", "golovi": 0, "tips": ["3 - 1", "0 - 0", "2 - 2", "0 - 1"], "code": "es"}, {"br": 20, "ime": "Džoni LB", "rep": "Francuska", "strelac": "Ojarzabal", "golovi": 0, "tips": ["3 - 1", "1 - 2", "0 - 0", "2 - 2"], "code": "fr"}, {"br": 21, "ime": "Uroš", "rep": "Engleska", "strelac": "Haland", "golovi": 0, "tips": ["1 - 1", "1 - 1", "2 - 1", "1 - 1"], "code": "eng"}], "matches": ["Meksiko - Južna Afrika", "Južna Koreja - Češka", "Kanada - Bosna", "USA - Paragvaj"], "results": ["2 - 0", "2 - 1", "", ""]};

// ====== STATE ======
let data = null;
let editMode = false;
let curTab = "rang";

function flag(code){return '<span class="flag">'+(FLAGS[code]||"")+'</span>';}
function teamCode(name){ if(!name) return ""; const n=name.trim(); return TEAM2CODE[n]|| TEAM2CODE[n.replace("Južna","J.")] || ""; }
function parse(s){ if(!s) return null; const m=String(s).replace(/[–—]/g,"-").match(/(\d+)\s*-\s*(\d+)/); return m?[+m[1],+m[2]]:null; }
function outcome(p){ return !p?null:(p[0]>p[1]?1:(p[0]===p[1]?0:2)); }
function matchPts(tip,res){ const p=parse(tip),r=parse(res); if(!p||!r) return 0; if(p[0]===r[0]&&p[1]===r[1]) return 5; if(outcome(p)===outcome(r)) return 2; return 0; }

function compute(){
  data.players.forEach(p=>{
    let m=0; for(let i=0;i<4;i++) m+=matchPts(p.tips[i], data.results[i]);
    p._mec=m; p._strel=(+p.golovi||0)*5; p._uk=p._mec+p._strel;
  });
  // ranks (ties share place; tiebreak strelac)
  const sorted=[...data.players].sort((a,b)=> b._uk-a._uk || b._strel-a._strel || a.br-b.br);
  sorted.forEach((p,i)=>{ p._rank = (i>0 && p._uk===sorted[i-1]._uk) ? sorted[i-1]._rank : i+1; });
  return sorted;
}

function splitMatch(name){
  if(!name) return ["",""];
  const parts=name.split(/\s[-–]\s/); return [parts[0]||"", parts[1]||""];
}
function shortName(name){
  const [a,b]=splitMatch(name);
  const ab=s=>s.replace(/^(J\.|Južna|Severna|S\.)\s*/,'').slice(0,3).toUpperCase()||s.slice(0,3).toUpperCase();
  return ab(a)+"–"+ab(b);
}

// ====== RENDER ======
function renderFixtures(){
  const wrap=document.getElementById("fixtures"); wrap.innerHTML="";
  data.matches.forEach((mname,i)=>{
    const [a,b]=splitMatch(mname);
    const res=data.results[i]||"";
    let scoreHtml;
    if(editMode){
      const r=parse(res); const hv=r?r[0]:""; const av=r?r[1]:"";
      scoreHtml='<input class="resin" data-res="'+i+'" data-side="h" value="'+hv+'" inputmode="numeric"> <span style="font-weight:700;color:#94A3B8">:</span> <input class="resin" data-res="'+i+'" data-side="a" value="'+av+'" inputmode="numeric">';
    } else if(res){
      scoreHtml='<span class="fxscore">'+res.replace(" - "," : ")+'</span>';
    } else {
      scoreHtml='<span class="blank">·</span><span style="font-weight:700;color:#94A3B8">:</span><span class="blank">·</span>';
    }
    const el=document.createElement("div");
    el.className="fx"+(res?" done":"");
    el.innerHTML='<div class="cap">'+(res?"rezultat":"uskoro")+'</div>'+
      '<div class="row">'+flag(teamCode(a))+'<span class="nat">'+(a||"—")+'</span></div>'+
      '<div class="row">'+flag(teamCode(b))+'<span class="nat">'+(b||"—")+'</span></div>'+
      '<div class="scorebox">'+scoreHtml+'</div>';
    wrap.appendChild(el);
  });
  // wire result inputs
  if(editMode){
    wrap.querySelectorAll(".resin").forEach(inp=>{
      inp.addEventListener("input",()=>{
        const i=+inp.dataset.res;
        const h=wrap.querySelector('.resin[data-res="'+i+'"][data-side="h"]').value.trim();
        const a=wrap.querySelector('.resin[data-res="'+i+'"][data-side="a"]').value.trim();
        data.results[i]=(h!==""&&a!=="")?(h+" - "+a):"";
        save(); renderBoard();
      });
    });
  }
}

function thead(){
  const sm=data.matches.map(shortName);
  return '<tr><th class="c">Mj.</th><th class="c">#</th><th>Igrač</th><th>Šampion</th><th>Strelac</th>'+
    (editMode?'<th class="c">Gol</th>':'')+
    sm.map(s=>'<th class="c">'+s+'</th>').join('')+
    '<th class="c">Bodova</th></tr>';
}

function renderBoard(){
  const sorted=compute();
  document.getElementById("thead").innerHTML=thead();
  const tb=document.getElementById("tbody"); tb.innerHTML="";
  const list = curTab==="rang" ? sorted : [...data.players].sort((a,b)=>a.br-b.br);
  list.forEach(p=>{
    const medal={1:"🥇",2:"🥈",3:"🥉"}[p._rank]||"";
    const tr=document.createElement("tr");
    if(p._rank<=3 && curTab==="rang") tr.className="r"+p._rank;
    let cells="";
    for(let i=0;i<4;i++){
      if(editMode){
        cells+='<td class="tip"><input class="tipin" data-pl="'+p.br+'" data-mi="'+i+'" value="'+(p.tips[i]||"")+'" placeholder="– : –"></td>';
      } else {
        const v=p.tips[i]; const pts=matchPts(v,data.results[i]);
        cells+='<td class="tip">'+(v?'<span class="chip">'+v.replace(" - ","–")+'</span>'+(pts?'<span class="pts">+'+pts+'</span>':''):'<span class="chip empty">—</span>')+'</td>';
      }
    }
    const golCell = editMode ? '<td class="c"><input class="golin" data-pl="'+p.br+'" data-gol="1" value="'+(p.golovi||0)+'" inputmode="numeric"></td>' : '';
    tr.innerHTML=
      '<td class="rank">'+(medal&&curTab==="rang"?'<span class="medal">'+medal+'</span>':'<span class="rnum">'+(curTab==="rang"?p._rank:p.br)+'</span>')+'</td>'+
      '<td class="num">'+p.br+'</td>'+
      '<td><div class="player"><span class="av">'+(p.ime||"?")[0]+'</span>'+p.ime+'</div></td>'+
      '<td><div class="champ">'+flag(p.code||REP2CODE[p.rep]||"")+(p.rep||"")+'</div></td>'+
      '<td class="strelac">'+(p.strelac||"")+'</td>'+
      golCell+ cells+
      '<td class="tot">'+p._uk+'</td>';
    tb.appendChild(tr);
  });
  if(editMode){
    tb.querySelectorAll(".tipin").forEach(inp=>inp.addEventListener("input",()=>{
      const p=data.players.find(x=>x.br==inp.dataset.pl); p.tips[+inp.dataset.mi]=inp.value.trim(); save();
      document.querySelectorAll('.tot').forEach(()=>{}); refreshTotals();
    }));
    tb.querySelectorAll(".golin").forEach(inp=>inp.addEventListener("input",()=>{
      const p=data.players.find(x=>x.br==inp.dataset.pl); p.golovi=+inp.value||0; save(); refreshTotals();
    }));
  }
}
function refreshTotals(){
  compute();
  const rows=document.querySelectorAll("#tbody tr");
  const list = curTab==="rang" ? compute() : [...data.players].sort((a,b)=>a.br-b.br);
  // simplest: re-render board to keep totals + (in rang) order correct
  renderBoard();
}

// ====== PERSISTENCE ======
const LS_KEY="sp2026_data";
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
function load(){
  // priority: published data.json (same folder) -> localStorage draft -> baked SEED
  return fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(pub=>{
    const draft = (()=>{try{return JSON.parse(localStorage.getItem(LS_KEY));}catch(e){return null;}})();
    data = pub || draft || JSON.parse(JSON.stringify(SEED));
    // ensure shape
    if(!data.results) data.results=["","","",""];
    if(!data.matches) data.matches=SEED.matches.slice();
  });
}

// ====== EDIT MODE ======
document.getElementById("adminBtn").onclick=()=>{
  if(editMode){ // turn off
    editMode=false; document.body.classList.remove("edit");
    document.getElementById("adminBtn").textContent="🔒 Uredi";
    document.getElementById("exportBtn").classList.add("hide");
    document.getElementById("backupBtn").classList.add("hide");
    document.getElementById("editnote").classList.add("hide");
    document.getElementById("hint").textContent="";
    renderAll();
  } else {
    document.getElementById("pinModal").classList.add("show");
    document.getElementById("pinInput").focus();
  }
};
function tryPin(){
  const v=document.getElementById("pinInput").value;
  if(v===ADMIN_PIN){
    editMode=true; document.body.classList.add("edit");
    document.getElementById("adminBtn").textContent="✓ Završi izmene";
    document.getElementById("exportBtn").classList.remove("hide");
    document.getElementById("backupBtn").classList.remove("hide");
    document.getElementById("editnote").classList.remove("hide");
    document.getElementById("hint").textContent="Izmene se čuvaju lokalno na ovom uređaju. Klikni Objavi (data.json) pa postavi taj fajl na GitHub da svi vide novo stanje.";
    closePin(); renderAll();
  } else { alert("Pogrešan PIN."); }
}
function closePin(){ document.getElementById("pinModal").classList.remove("show"); document.getElementById("pinInput").value=""; }
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryPin();});

// ====== EXPORT / IMPORT ======
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="data.json"; a.click();
};
document.getElementById("backupBtn").onclick=()=>{
  const stamp=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="rezerva_"+stamp+".json"; a.click();
};

// ====== TABS ======
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); curTab=t.dataset.tab;
  document.getElementById("tablabel").textContent = curTab==="rang"?"Rang-lista":"Svi tipovi";
  renderBoard();
});

function renderAll(){ renderFixtures(); renderBoard(); }

// host flags
function setHost(){ document.getElementById("hca").innerHTML=FLAGS.ca; document.getElementById("hmx").innerHTML=FLAGS.mx; document.getElementById("hus").innerHTML=FLAGS.us; }

load().then(()=>{ setHost(); renderAll(); });
