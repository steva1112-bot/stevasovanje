<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP 2026 — Prognoza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAEEF3;--surface:#fff;--ink:#0C1B2A;--muted:#64748B;--hair:#E4E9F0;--pitch:#00B26B;--pitch-d:#089b60;--chip:#F1F5F9;--gold:#E3A81B;--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:60px}
.app{max-width:1040px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#0C1B2A 0%,#0f243a 55%,#0a3a20 100%);color:#fff;border-radius:0 0 26px 26px;padding:30px 22px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,178,107,.30),transparent 70%)}
.hero-row{display:flex;align-items:center;gap:18px;position:relative;z-index:1;flex-wrap:wrap}
.crest{width:78px;height:78px;flex-shrink:0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.5vw,38px);letter-spacing:-.01em;line-height:1.05}
.hero .tag{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#7FE3B5;margin-bottom:4px}
.hero .host{display:flex;gap:6px;margin-top:9px;align-items:center;font-size:12px;color:#C7D2DE}
.hflag{width:22px;height:15px;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.25);display:inline-block}
.hflag svg{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:4px}
.tab{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--muted);border:none;background:none}
.tab.active{background:var(--ink);color:#fff}
.spacer{flex:1}
.btn{font-family:var(--display);font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer;border:1px solid var(--hair);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#cbd5e1}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:#063}
.editflag{font-family:var(--display);font-weight:600;font-size:12px;color:var(--pitch-d);background:rgba(0,178,107,.12);padding:7px 12px;border-radius:999px;display:none}
body.edit .editflag{display:inline-flex;align-items:center;gap:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.roundbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.rsel{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 12px;border:1px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink)}
.rpill{font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted)}
.sec-label{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 2px 11px}
.fixtures{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:760px){.fixtures{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){
  body{padding-bottom:40px}
  .app{padding:0 11px}
  .hero{padding:20px 16px 18px;border-radius:0 0 20px 20px}
  .crest{width:54px;height:54px}
  .hero-row{gap:13px}
  .hero h1{font-size:23px}
  .hero .tag{font-size:10px;letter-spacing:.16em}
  .hero .host{font-size:11px;margin-top:7px}
  .bar{gap:7px;margin:14px 0 4px}
  .tab{padding:7px 13px;font-size:13px}
  .btn{padding:8px 12px;font-size:12px}
  .roundbar{gap:6px}
  .rsel{font-size:12px;padding:7px 9px;max-width:62vw}
  .rpill{font-size:11px}
  .sec-label{font-size:11px;margin:14px 2px 9px}
  /* fixtures: single column, airy and readable */
  .fixtures{grid-template-columns:1fr;gap:9px}
  .fx{padding:13px 14px;border-radius:13px}
  .fx .row{font-size:14px}
  .fxscore{font-size:20px}
  .cap{font-size:9px}
  .flag{width:24px;height:16px}
  /* STANDINGS: hide extra columns -> Mj | Igrač | UKUPNO only, full width, no scroll */
  .col-extra{display:none!important}
  table{min-width:0!important;width:100%!important}
  .lbl-full{display:none}.lbl-short{display:inline}
  .col-strel{padding-left:4px!important;padding-right:6px!important}
  thead th{padding:11px 8px 9px;font-size:11px}
  tbody td{padding:11px 8px}
  .rank{width:38px}
  .player{font-size:15px;gap:9px}
  .av{width:26px;height:26px;font-size:12px}
  .tot{font-size:17px}
  /* champion + scorer as a small line under the name (Ukupno, mobile) */
  body.tab-ukupno .player{align-items:flex-start}
  body.tab-ukupno .player-sub{display:flex;align-items:center;gap:4px;margin-top:2px;font-weight:500;font-size:10px;color:var(--muted);white-space:nowrap}
  body.tab-ukupno .ps-rep{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:#475569}
  body.tab-ukupno .player-sub .flag{width:15px;height:10px}
  body.tab-ukupno .ps-dot{opacity:.45}
  body.tab-ukupno .ps-strel{color:#089b60}
  body.tab-ukupno .av{width:24px;height:24px}
  body.tab-ukupno tbody td{padding:9px 5px}
  body.tab-ukupno .rank{width:34px}
  /* PO KOLU: keep horizontal scroll but make player column sticky & compact */
  body.kolo-mobile .scroll{overflow-x:auto}
  .chip{min-width:40px;font-size:12px;padding:4px 7px}
  .tipin{width:48px}
  .pts{font-size:10px;margin-left:3px}
  .foot{font-size:11px;margin-top:16px}
  .card{padding:22px}
  /* sticky player name when scrolling matches in 'Po kolu' */
  body:not(.tab-ukupno) tbody td:nth-child(2),
  body:not(.tab-ukupno) thead th:nth-child(2){position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 0 var(--hair)}
  body:not(.tab-ukupno) thead th:nth-child(2){background:#FBFCFE}
}
.fx{background:#fff;border:1px solid var(--hair);border-radius:15px;padding:14px;position:relative;overflow:hidden}
.fx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#CBD5E1}
.fx.done::before{background:var(--pitch)}
.fx .row{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.fx .row+.row{margin-top:7px}
.fx .nat{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamin{flex:1;border:1px solid var(--hair);border-radius:7px;padding:4px 7px;font-size:12px;font-family:var(--body);min-width:0}
.flag{width:23px;height:15px;border-radius:3px;overflow:hidden;border:1px solid rgba(12,27,42,.12);flex-shrink:0;display:inline-block;background:#fff}
.flag svg{display:block;width:100%;height:100%}
.scorebox{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--hair)}
.fxscore{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:2px}
.fxtime{font-family:var(--display);font-weight:700;font-size:19px;color:#334155;letter-spacing:1px}
.cap{position:absolute;top:11px;right:12px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.resin{width:30px;height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;border:1.5px solid var(--hair);border-radius:8px;background:#FAFBFD}
.blank{width:28px;height:32px;border:1.5px solid var(--hair);border-radius:8px;background:#FAFBFD;display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-family:var(--display);font-weight:700}
.board{background:#fff;border:1px solid var(--hair);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(12,27,42,.06);margin-top:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
thead th{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 9px 10px;background:#FBFCFE;border-bottom:1px solid var(--hair);white-space:nowrap}
thead th.c{text-align:center}
tbody td{padding:9px;border-bottom:1px solid var(--hair);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.rank{width:44px;text-align:center}.medal{font-size:18px}.rnum{font-family:var(--display);font-weight:600;color:var(--muted)}
tr.r1 td{background:linear-gradient(90deg,rgba(227,168,27,.16),transparent 60%)}
tr.r2 td{background:linear-gradient(90deg,rgba(150,160,170,.16),transparent 60%)}
tr.r3 td{background:linear-gradient(90deg,rgba(200,140,80,.14),transparent 60%)}
.num{font-family:var(--display);font-weight:600;color:var(--muted);width:28px;text-align:center;font-size:12px}
.player{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.pname{display:flex;flex-direction:column;line-height:1.15}
.player-sub{display:none}
/* Ukupno: minimal layout on ALL screen sizes (flag + abbr + scorer under name) */
body.tab-ukupno .player{align-items:flex-start}
body.tab-ukupno .player-sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-weight:500;font-size:11px;color:var(--muted);white-space:nowrap}
body.tab-ukupno .player-sub .flag{width:17px;height:11px}
body.tab-ukupno .ps-rep{font-family:var(--display);font-weight:700;letter-spacing:.04em;color:#475569}
body.tab-ukupno .ps-dot{opacity:.45}
body.tab-ukupno .ps-strel{color:#089b60}
body.tab-ukupno .col-champ{display:none!important}
body.tab-ukupno .col-extra{display:none!important}
.av{width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.champ{display:flex;align-items:center;gap:8px;color:#334155;white-space:nowrap;font-size:13px}
.strelac{color:var(--muted);white-space:nowrap;font-size:13px}
td.tip{text-align:center}
.chip{font-family:var(--display);font-weight:600;font-size:13px;background:var(--chip);color:var(--ink);padding:5px 9px;border-radius:8px;display:inline-block;min-width:44px}
.chip.empty{background:transparent;color:#CBD5E1}
.tot{font-family:var(--display);font-weight:700;font-size:16px;text-align:center;color:var(--pitch-d)}
.sub{font-family:var(--display);font-weight:600;font-size:13px;text-align:center;color:var(--muted)}
.tipin{width:54px;text-align:center;font-family:var(--display);font-weight:600;font-size:13px;border:1px solid var(--hair);border-radius:7px;padding:5px 4px;background:#FAFBFD}
.tipwrap{display:inline-flex;align-items:center;gap:4px}
.tipbox{width:26px;height:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;border:1px solid var(--hair);border-radius:7px;padding:0;background:#FAFBFD}
.tipbox:focus{outline:2px solid var(--pitch);outline-offset:0;border-color:var(--pitch)}
.tipdash{font-family:var(--display);font-weight:700;color:#94A3B8}
.golin{width:42px;text-align:center;font-family:var(--display);font-weight:600;font-size:13px;border:1px solid var(--hair);border-radius:7px;padding:5px;background:#FAFBFD}
.golview{text-align:center}
.golnum{font-family:var(--display);font-weight:700;font-size:14px;color:#089b60;background:rgba(0,178,107,.12);padding:3px 9px;border-radius:7px;display:inline-block;min-width:24px}
.golzero{font-family:var(--display);font-weight:600;color:#CBD5E1}
.pts{font-family:var(--display);font-weight:700;font-size:11px;color:var(--pitch-d);margin-left:5px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
.hide{display:none!important}
.lbl-short{display:none}.lbl-full{display:inline}
.modal{position:fixed;inset:0;background:rgba(12,27,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.card{background:#fff;border-radius:18px;padding:26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card h3{font-family:var(--display);font-size:18px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted);margin-bottom:16px}
.card input{width:100%;padding:11px 13px;border:1px solid var(--hair);border-radius:10px;font-size:15px;font-family:var(--body);margin-bottom:14px}
.card .row2{display:flex;gap:9px}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-row">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD966"/><stop offset="1" stop-color="#E3A81B"/></linearGradient></defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#7FE3B5" stroke-width="2" opacity=".5"/>
      <circle cx="50" cy="50" r="38" fill="rgba(255,255,255,.04)"/>
      <path d="M38 28 h24 v10 a12 12 0 0 1 -24 0 z" fill="url(#g)"/>
      <path d="M38 30 h-7 a8 8 0 0 0 8 9" fill="none" stroke="url(#g)" stroke-width="3"/>
      <path d="M62 30 h7 a8 8 0 0 1 -8 9" fill="none" stroke="url(#g)" stroke-width="3"/>
      <rect x="46" y="50" width="8" height="9" fill="url(#g)"/>
      <rect x="40" y="59" width="20" height="5" rx="1.5" fill="url(#g)"/>
      <text x="50" y="80" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="13" fill="#fff">2026</text>
    </svg>
    <div>
      <div class="tag">Prognoza · Kladionica ekipe</div>
      <h1>Svetsko prvenstvo 2026</h1>
      <div class="host">Domaćini:
        <span class="hflag" id="hca"></span><span class="hflag" id="hmx"></span><span class="hflag" id="hus"></span>
        <span style="margin-left:4px">Kanada · Meksiko · SAD</span>
      </div>
    </div>
  </div>
</div>
<div class="app">
  <div class="bar">
    <div class="tabs">
      <button class="tab active" data-tab="ukupno">Ukupno</button>
      <button class="tab" data-tab="kolo">Po danu</button>
    </div>
    <span class="editflag">✎ Režim izmena</span>
    <div class="spacer"></div>
    <button class="btn" id="adminBtn">🔒 Uredi</button>
    <button class="btn hide" id="newRoundBtn">+ Novi dan</button>
    <button class="btn primary hide" id="copyBtn">📋 Prekopiraj podatke</button>
    <button class="btn hide" id="exportBtn">⤓ Objavi (fajl)</button>
    <button class="btn hide" id="backupBtn">Rezerva</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="roundbar">
    <span class="rpill">Dan:</span>
    <select class="rsel" id="roundSel"></select>
    <span class="rpill" id="roundInfo"></span>
  </div>

  <div class="sec-label">Mečevi <span id="editnote" class="hide" style="text-transform:none;letter-spacing:0;color:var(--pitch-d)">· upiši rezultate ovog dana</span></div>
  <div class="fixtures" id="fixtures"></div>

  <div class="sec-label" id="tablabel">Ukupna rang-lista</div>
  <div class="board"><div class="scroll"><table>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table></div></div>

  <div class="foot">🥇 vodi · UKUPNO sabira sva kola · računa se uživo</div>
</div>

<div class="modal" id="pinModal"><div class="card">
  <h3>Uređivanje</h3>
  <p>Unesi PIN da otključaš izmene. Ostali vide samo rezultate.</p>
  <input type="password" id="pinInput" placeholder="PIN" autocomplete="off">
  <div class="row2"><button class="btn" style="flex:1" onclick="closePin()">Otkaži</button>
  <button class="btn primary" style="flex:1" onclick="tryPin()">Otključaj</button></div>
</div></div>

function flag(c){return '<span class="flag">'+(FLAGS[c]||"")+'</span>';}

function parse(s){ if(!s) return null; const m=String(s).replace(/[–—]/g,"-").match(/(\d+)\s*-\s*(\d+)/); return m?[+m[1],+m[2]]:null; }
function outcome(p){ return !p?null:(p[0]>p[1]?1:(p[0]===p[1]?0:2)); }
function matchPts(tip,res){ const p=parse(tip),r=parse(res); if(!p||!r) return 0; if(p[0]===r[0]&&p[1]===r[1]) return 5; if(outcome(p)===outcome(r)) return 2; return 0; }

// points for one player in one round
function roundPoints(pid, rIdx){
  const rd=data.rounds[rIdx]; const e=rd.entries[pid]||{tips:[],golovi:0};
  let m=0; const n=rd.matches.length;
  for(let i=0;i<n;i++) m+=matchPts((e.tips||[])[i], rd.results[i]);
  const s=(+e.golovi||0)*3;
  return {mec:m, strel:s, uk:m+s};
}
function grand(pid){

}
function computeStandings(){

  rows.sort((a,b)=> b._uk-a._uk || b._strel-a._strel || a.br-b.br);
  rows.forEach((p,i)=>{ p._rank=(i>0&&p._uk===rows[i-1]._uk&&p._strel===rows[i-1]._strel)?rows[i-1]._rank:i+1; });

}

        const pl=inp.dataset.pl, mi=inp.dataset.mi;
        const h=tb.querySelector('.tipbox[data-pl="'+pl+'"][data-mi="'+mi+'"][data-side="h"]').value.trim();
        const a=tb.querySelector('.tipbox[data-pl="'+pl+'"][data-mi="'+mi+'"][data-side="a"]').value.trim();
        const e=data.rounds[curRound].entries[pl]; if(!e.tips)e.tips=[];
        e.tips[+mi]=(h!==""||a!=="")?(h+" - "+a):"";
        save();
        if(inp.dataset.side==="h" && inp.value.length>=1){
          const away=tb.querySelector('.tipbox[data-pl="'+pl+'"][data-mi="'+mi+'"][data-side="a"]');
          if(away){ away.focus(); }
        }
        updateTotalsOnly();
        });
      });
      tb.querySelectorAll(".golin").forEach(inp=>inp.addEventListener("input",()=>{
        inp.value=inp.value.replace(/[^0-9]/g,"").slice(0,2);
        data.rounds[curRound].entries[inp.dataset.pl].golovi=+inp.value||0; save(); updateTotalsOnly();
      }));
    }
  }
}
function refreshTotals(){ renderBoard(); }
// Light update: refresh only the per-day total cells (keeps input focus while typing)
function updateTotalsOnly(){
  if(curTab!=="kolo") { renderBoard(); return; }
  document.querySelectorAll('#tbody .tot[data-tot]').forEach(td=>{
    const pid=td.getAttribute('data-tot');
    td.textContent = roundPoints(pid, curRound).uk;
  });
}

function renderRoundSel(){
  const sel=document.getElementById("roundSel"); sel.innerHTML="";
  data.rounds.forEach((r,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=r.naziv||("Kolo "+(i+1)); sel.appendChild(o); });
  sel.value=curRound;
  // info: points scored this round (sum of all players' round uk) and played matches
  const rd=data.rounds[curRound]; const played=rd.results.filter(x=>x).length;
  document.getElementById("roundInfo").textContent="("+played+"/"+rd.matches.length+" mečeva odigrano)";
}

const LS_KEY="sp2026_rounds";
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
function migrate(d){ if(!d.rounds){ /* old flat format -> wrap */ } if(!d.champions) d.champions={}; return d; }
function load(){
  return fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(pub=>{
    const draft=(()=>{try{return JSON.parse(localStorage.getItem(LS_KEY));}catch(e){return null;}})();
    data = (pub&&pub.rounds)?pub : (draft&&draft.rounds)?draft : JSON.parse(JSON.stringify(MODEL));
    data=migrate(data);
  });
}

document.getElementById("adminBtn").onclick=()=>{
  if(editMode){ editMode=false; document.body.classList.remove("edit");
    document.getElementById("adminBtn").textContent="🔒 Uredi";
    ["exportBtn","backupBtn","newRoundBtn","copyBtn"].forEach(id=>document.getElementById(id).classList.add("hide"));
    document.getElementById("editnote").classList.add("hide"); document.getElementById("hint").textContent="";
    renderAll();
  } else { document.getElementById("pinModal").classList.add("show"); document.getElementById("pinInput").focus(); }
};
function tryPin(){ if(document.getElementById("pinInput").value===ADMIN_PIN){
    editMode=true; document.body.classList.add("edit");
    document.getElementById("adminBtn").textContent="✓ Završi izmene";
    ["exportBtn","backupBtn","newRoundBtn","copyBtn"].forEach(id=>document.getElementById(id).classList.remove("hide"));
    document.getElementById("editnote").classList.remove("hide");
    document.getElementById("hint").textContent="Biraš dan gore, pa upisuješ mečeve, rezultate, tipove i golove. UKUPNO sabira sva kola. Na kraju klikni Objavi i postavi data.json na GitHub.";
    closePin(); curTab="kolo"; setTab(); renderAll();
  } else alert("Pogrešan PIN."); }
function closePin(){ document.getElementById("pinModal").classList.remove("show"); document.getElementById("pinInput").value=""; }
document.getElementById("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryPin();});

document.getElementById("newRoundBtn").onclick=()=>{
  const n=data.rounds.length+1;
  const tmpl=data.rounds[0].matches.length||4;
  const entries={}; data.players.forEach(p=>entries[String(p.br)]={tips:Array(tmpl).fill(""),golovi:0});
  data.rounds.push({naziv:"Kolo "+n, matches:Array(tmpl).fill(""), results:Array(tmpl).fill(""), entries});
  curRound=data.rounds.length-1; save(); renderRoundSel(); renderAll();
};
document.getElementById("exportBtn").onclick=()=>{ dl(JSON.stringify(data,null,2),"data.json"); };
document.getElementById("copyBtn").onclick=async ()=>{
  const txt=JSON.stringify(data,null,2);
  const btn=document.getElementById("copyBtn"); const old=btn.textContent;
  function done(ok){ btn.textContent= ok? "✓ Kopirano!" : "✗ Nije uspelo — drži pa Copy";
    document.getElementById("hint").textContent= ok
      ? "Podaci su u memoriji. Na GitHubu otvori sp2026/data.json → olovka (Edit) → obriši sve → Nalepi (Paste) → Commit."
      : "Kopiranje nije prošlo automatski. Koristi dugme „Objavi (fajl)“ umesto toga.";
    setTimeout(()=>{btn.textContent=old;},2500);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); done(true); }
    else { throw new Error("no clipboard api"); }
  }catch(e){
    // fallback: temp textarea + execCommand
    try{
      const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand("copy"); document.body.removeChild(ta); done(ok);
    }catch(e2){ done(false); }
  }
};
document.getElementById("backupBtn").onclick=()=>{ dl(JSON.stringify(data,null,2),"rezerva_"+new Date().toISOString().slice(0,10)+".json"); };
function dl(txt,name){ const b=new Blob([txt],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); }

document.getElementById("roundSel").onchange=e=>{ curRound=+e.target.value; renderRoundSel(); renderAll(); };
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ curTab=t.dataset.tab; setTab(); renderBoard(); });
function setTab(){ document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===curTab));
  document.body.classList.toggle("tab-ukupno", curTab==="ukupno");
  document.getElementById("tablabel").textContent = curTab==="ukupno"?"Ukupna rang-lista":("Bodovi — "+(data.rounds[curRound].naziv||"")); }

function setHost(){ document.getElementById("hca").innerHTML=FLAGS.ca; document.getElementById("hmx").innerHTML=FLAGS.mx; document.getElementById("hus").innerHTML=FLAGS.us; }
function renderAll(){ renderRoundSel(); setTab(); renderFixtures(); renderBoard(); }
load().then(()=>{ setHost(); renderAll(); });
</script>
